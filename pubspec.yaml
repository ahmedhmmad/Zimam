name: zimam
description: "Cross-border personal wealth tracker. Local-first, multi-currency."
publish_to: 'none'

# versionName+versionCode. Version scheme is formalised in Phase 6.
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management.
  flutter_riverpod: ^3.0.3

  # Navigation.
  go_router: ^17.2.1

  # Localisation / formatting. Pulled in by flutter_localizations; pinned
  # explicitly because Money formatting (Phase 1) depends on it directly.
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n (see l10n.yaml)

  assets:
    # The parser rule pack. Bundled so capture works on first launch with no
    # network; a downloaded pack supersedes it only when its version is higher.
    - assets/parser_rules/

  # Bundled rather than fetched at runtime: the app is local-first and must
  # render correctly on a cold start in airplane mode. Both families are
  # OFL 1.1 licensed — see the OFL-*.txt files alongside them.
  fonts:
    # Prose. The Arabic family is a separate typeface from the Latin one;
    # Latin IBM Plex Sans has no Arabic coverage at all.
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    # Every currency amount, percentage and date.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
